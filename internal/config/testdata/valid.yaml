version: 1
resources:
  search_laws:
    url: https://nuevo.leychile.cl
    path: /servicios/buscarjson
    method: GET
    timeout: 10s
    retry:
      attempts: 3
      backoff: 500ms
      max_backoff: 5s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s
  get_law:
    url: https://nuevo.leychile.cl
    path: /servicios/Navegar/get_norma_json
    method: GET
    timeout: 15s
    retry:
      attempts: 2
      backoff: 1s
      max_backoff: 4s
    circuit_breaker:
      failure_threshold: 5
      success_threshold: 2
      reset_timeout: 30s
